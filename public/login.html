<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - AIRIS</title>
    <link rel="stylesheet" href="/css/style.css">
    <script src="/js/theme.js"></script>
</head>
<body>
    <nav class="navbar">
        <div class="container">
            <div class="nav-brand">
                <h2><a href="/">🤖 AIRIS <span class="brand-badge">Access</span></a></h2>
            </div>
            <div class="nav-links">
                <button id="themeToggleBtn" class="theme-toggle-btn" aria-label="Toggle dark mode" title="Toggle theme">
                    <span class="theme-icon">🌙</span>
                </button>
                <a href="/register">Register</a>
            </div>
        </div>
    </nav>

    <div class="auth-container">
        <div class="auth-card">
            <h2>Welcome Back</h2>
            <form id="loginForm">
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" placeholder="name@company.com" required>
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" placeholder="••••••••" required>
                </div>
                <div id="errorMessage" class="error-message"></div>
                <button type="submit" class="btn-primary btn-block">Sign In</button>
            </form>
            <div style="margin-top: 1.5rem; padding: 1rem; background: var(--bg-subtle); border-radius: 12px; font-size: 0.88rem; color: var(--text-secondary); border: 1px solid var(--border-color);">
                <strong style="color: var(--text-primary); display: block; margin-bottom: 0.35rem;">🚀 Quick Demo Credentials:</strong>
                • <strong>Recruiter:</strong> <code>admin@company.com</code> / <code>admin123</code><br>
                • <strong>Applicant:</strong> <code>alex.morgan@example.com</code> / <code>alex123</code>
            </div>
            <p class="auth-footer">
                Don't have an account? <a href="/register">Register here</a>
            </p>
        </div>
    </div>

    <script src="/js/auth.js"></script>
</body>
</html>
